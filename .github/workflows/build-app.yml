name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

    - name: Build Web Assets
      run: npm run build

    - name: Initialize Capacitor
      run: |
        npx cap init "Mushaf App" com.example.mushaf --web-dir dist || true
        npx cap add android || true

    - name: Prepare Assets & Generate App Icon
      run: |
        mkdir -p assets
        mkdir -p resources
        if [ -f "public/icon.png" ]; then
          cp public/icon.png assets/logo.png
          cp public/icon.png assets/icon-only.png
          cp public/icon.png resources/icon.png
        elif [ -f "icon.png" ]; then
          cp icon.png assets/logo.png
          cp icon.png assets/icon-only.png
          cp icon.png resources/icon.png
        fi
        npx @capacitor/assets generate --android --iconBackgroundColor '#121212' || true

    - name: Fix Top Bar & Notch Overlapping
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.example.mushaf",
          "appName": "Mushaf App",
          "webDir": "dist",
          "android": {
            "allowMixedContent": true
          },
          "plugins": {
            "StatusBar": {
              "overlaysWebView": false,
              "backgroundColor": "#121212"
            }
          }
        }
        EOF
        npx cap sync android
        
        # Disable EdgeToEdge forced transparency in Android styles
        sed -i 's/<item name="android:windowTranslucentStatus">true<\/item>/<item name="android:windowTranslucentStatus">false<\/item>/g' android/app/src/main/res/values/styles.xml || true
        sed -i 's/<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">/<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">\n        <item name="android:windowFitsSystemWindows">true<\/item>/g' android/app/src/main/res/values/styles.xml || true

    - name: Fix Duplicate Kotlin Classes
      run: |
        echo "configurations.all { resolutionStrategy.eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.8.22' } } }" >> android/app/build.gradle

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK & Release AAB
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        ./gradlew bundleRelease

    - name: Upload APK & AAB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-builds
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/bundle/release/app-release.aab
