name: Build Android App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'electron/**'
      - '.github/workflows/build-desktop.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core@8.5.1 @capacitor/cli@8.5.1 @capacitor/android@8.5.1 @capacitor/assets@3.0.5 @capacitor/geolocation@8.2.2 @capacitor/local-notifications@8.3.1

    - name: Build Web Assets
      env:
        VITE_APP_VERSION: 1.0.${{ github.run_number }}
      run: npm run build

    - name: Drop the gzip copy of the Quran text (Android packs assets itself; a .gz beside the .txt collides)
      run: |
        rm -f dist/quran/quran-uthmani.txt.gz
        sed -i 's#,"/quran/quran-uthmani.txt.gz"##; s#"/quran/quran-uthmani.txt.gz",##' dist/sw.js
        ! grep -q "quran-uthmani.txt.gz" dist/sw.js

    - name: Initialize Capacitor
      run: |
        npx cap init "Mushaf" com.ahmad.mushaf --web-dir dist || true
        npx cap add android || true

    - name: Prepare Assets & Generate App Icon
      run: |
        mkdir -p assets
        mkdir -p resources
        if [ -f "public/icon.png" ]; then
          cp public/icon.png assets/logo.png
          cp public/icon.png assets/icon-only.png
          cp public/icon.png resources/icon.png
        elif [ -f "icon.png" ]; then
          cp icon.png assets/logo.png
          cp icon.png assets/icon-only.png
          cp icon.png resources/icon.png
        fi
        npx @capacitor/assets generate --android --iconBackgroundColor '#121212' || true

    - name: Configure Capacitor and preserve Android safe areas
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.ahmad.mushaf",
          "appName": "Mushaf",
          "webDir": "dist",
          "android": {
            "allowMixedContent": false
          }
        }
        EOF

        npx cap sync android
        # Capacitor generates the manifest during the build; declare runtime permissions explicitly.
        python3 - <<'PY'
        from pathlib import Path
        manifest = Path('android/app/src/main/AndroidManifest.xml')
        text = manifest.read_text()
        permissions = '''    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
        '''
        marker = '<manifest '
        start = text.find('>', text.find(marker)) + 1
        if 'android.permission.ACCESS_FINE_LOCATION' not in text:
            text = text[:start] + '\\n' + permissions + text[start:]
            manifest.write_text(text)
        PY
        # Copy and register the persistent Android home-screen widget.
        python3 scripts/prepare-widget-android.py

    - name: Fix Duplicate Kotlin Classes
      run: |
        echo "configurations.all { resolutionStrategy.eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.8.22' } } }" >> android/app/build.gradle

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Configure release signing (Play upload key from secrets)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
        test -s "$RUNNER_TEMP/upload.jks"
        KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" python3 scripts/configure-release-signing.py

    - name: Build signed release APK & AAB
      env:
        KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        VERSION_CODE: ${{ github.run_number }}
        VERSION_NAME: 1.0.${{ github.run_number }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease bundleRelease
        mkdir -p ../release
        cp app/build/outputs/apk/release/app-release.apk ../release/Mushaf_release.apk
        cp app/build/outputs/bundle/release/app-release.aab ../release/Mushaf_release.aab

    - name: Upload APK & AAB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-release
        path: |
          release/Mushaf_release.apk
          release/Mushaf_release.aab

    - name: Publish APK to the GitHub Release (permanent link releases/latest/download/Mushaf.apk)
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/publish-release.sh "1.0.${{ github.run_number }}" release/Mushaf_release.apk Mushaf.apk

    - name: Verify signatures and widgets
      if: always()
      continue-on-error: true
      run: |
        BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        "$BT/apksigner" verify --verbose --print-certs release/Mushaf_release.apk | grep -v "^WARNING" | head -20
        jarsigner -verify release/Mushaf_release.aab | tail -2
        keytool -printcert -jarfile release/Mushaf_release.aab | grep -E "SHA1|SHA256"
        "$BT/aapt2" dump badging release/Mushaf_release.apk | grep -E "^package|sdkVersion|targetSdkVersion"
        "$BT/aapt2" dump xmltree --file AndroidManifest.xml release/Mushaf_release.apk | grep -E "WidgetProvider" 
        rm -f "$RUNNER_TEMP/upload.jks"
