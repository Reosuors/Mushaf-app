name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

    - name: Build Web Assets
      run: npm run build

    - name: Initialize & Sync Capacitor
      run: |
        npx cap init "Mushaf App" com.example.mushaf --web-dir dist || true
        npx cap add android || true

    - name: Generate App Icon
      run: |
        npx capacitor-assets generate --android || true

    - name: Disable WebView Overlay on System Bars (Fix Notch & Top Header)
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.example.mushaf",
          "appName": "Mushaf App",
          "webDir": "dist",
          "plugins": {
            "StatusBar": {
              "overlaysWebView": false,
              "backgroundColor": "#000000"
            }
          }
        }
        EOF
        npx cap sync android

    - name: Fix Android Fullscreen / EdgeToEdge Issue
      run: |
        sed -i 's/android:theme="@style/AppTheme.NoActionBar"/android:theme="@style\/AppTheme.NoActionBar" android:fitsSystemWindows="true"/g' android/app/src/main/AndroidManifest.xml || true

    - name: Fix Duplicate Kotlin Classes
      run: |
        echo "configurations.all { resolutionStrategy.eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.8.22' } } }" >> android/app/build.gradle

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK & Release AAB
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        ./gradlew bundleRelease

    - name: Upload APK & AAB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-builds
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/bundle/release/app-release.aab
