name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core@8.5.1 @capacitor/cli@8.5.1 @capacitor/android@8.5.1 @capacitor/assets@3.0.5 @capacitor/geolocation@8.2.2 @capacitor/local-notifications@8.3.1

    - name: Build Web Assets
      run: npm run build

    - name: Initialize Capacitor
      run: |
        npx cap init "Mushaf App" com.example.mushaf --web-dir dist || true
        npx cap add android || true

    - name: Prepare Assets & Generate App Icon
      run: |
        mkdir -p assets
        mkdir -p resources
        if [ -f "public/icon.png" ]; then
          cp public/icon.png assets/logo.png
          cp public/icon.png assets/icon-only.png
          cp public/icon.png resources/icon.png
        elif [ -f "icon.png" ]; then
          cp icon.png assets/logo.png
          cp icon.png assets/icon-only.png
          cp icon.png resources/icon.png
        fi
        npx @capacitor/assets generate --android --iconBackgroundColor '#121212' || true

    - name: Configure Capacitor and preserve Android safe areas
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.example.mushaf",
          "appName": "Mushaf App",
          "webDir": "dist",
          "android": {
            "allowMixedContent": true
          }
        }
        EOF

        # Keep viewport-fit=cover but do not add body padding: the app shell and bottom nav handle safe areas themselves.
        sed -i 's/<meta name="viewport"[^>]*>/<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">/g' dist/index.html || true
        npx cap sync android
        # Capacitor generates the manifest during the build; declare runtime permissions explicitly.
        python3 - <<'PY'
        from pathlib import Path
        manifest = Path('android/app/src/main/AndroidManifest.xml')
        text = manifest.read_text()
        permissions = '''    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
        '''
        marker = '<manifest '
        start = text.find('>', text.find(marker)) + 1
        if 'android.permission.ACCESS_FINE_LOCATION' not in text:
            text = text[:start] + '\\n' + permissions + text[start:]
            manifest.write_text(text)
        PY
        # Copy and register the persistent Android home-screen widget.
        python3 scripts/prepare-widget-android.py

    - name: Fix Duplicate Kotlin Classes
      run: |
        echo "configurations.all { resolutionStrategy.eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.8.22' } } }" >> android/app/build.gradle

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK & Release AAB
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        ./gradlew bundleRelease

    - name: Upload APK & AAB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-builds
        path: |
          android/app/build/outputs/apk/debug/app-debug.apk
          android/app/build/outputs/bundle/release/app-release.aab
